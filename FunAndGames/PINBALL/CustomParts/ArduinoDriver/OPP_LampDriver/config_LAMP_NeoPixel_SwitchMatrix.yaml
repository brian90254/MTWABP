#config_version=6

# FAST is the default platform. OPP is also loaded for the three USB Arduinos.
hardware:
  platform:
    - fast
    - opp

# Change controller if your FAST main controller is not a NEURON.
# Keep any additional FAST settings from your existing machine config.
fast:
  net:
    controller: neuron
    port: auto

opp:
  driverboards: gen2
  ports:
    - /dev/tty.usbmodem11301
    - /dev/cu.usbmodemREPLACE_WITH_MICRO
    - /dev/cu.usbmodemREPLACE_WITH_MEGA
  baud: 115200
  poll_hz: 100
  # These labels are associated with port paths, not discovered board addresses.
  chains:
    matrix: /dev/tty.usbmodem11301
    pixels: /dev/cu.usbmodemREPLACE_WITH_MICRO
    lamps: /dev/cu.usbmodemREPLACE_WITH_MEGA

# The matrix Arduino advertises OPP cards 0 and 1.
# Numbers are chain-card-input; "matrix" distinguishes its USB port.
switches:
  s_matrix_0:
    platform: opp
    number: matrix-0-0

  s_matrix_1:
