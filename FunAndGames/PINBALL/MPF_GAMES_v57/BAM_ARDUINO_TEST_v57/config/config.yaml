#config_version=6

# search for keyword "TODO" for easy things to customize your first game.

# -------------------------
# USE THIS SYNTAX WHEN COMBINING FAST AND OPP HARDWARE
# -------------------------
# hardware:
#   platform: fast
#   driverboards: fast

# fast:
#   ports: auto
#   # Or put your FAST controller ports here if you configure them explicitly.

# opp:
#   ports: /dev/tty.usbmodem11301
#   baud: 115200
#   poll_hz: 100

# switches:
#   # Arduino/OPP switch
#   s_matrix_0:
#     platform: opp
#     number: 0-0

#   # Example switch read directly through FAST
#   s_fast_example:
#     platform: fast       # Optional because FAST is the default
#     number: 0-0
# -----------------------

hardware:
  platform: opp

# ---------------
# HARDWARE
# ---------------
# hardware:
#   #driverboards: fast
#   platform: fast
#   lights: fadecandy

# opp:
#   ports: /dev/tty.usbmodem11301
#   baud: 115200
#   poll_hz: 100

# The Arduino presents the 5x8 matrix as two OPP input cards:
# card 0 = matrix switches 0-31; card 1 = matrix switches 32-39.
opp:
  driverboards: gen2
  ports:
    - /dev/tty.usbmodem11301
  baud: 115200
  poll_hz: 100
  chains:
    matrix: /dev/tty.usbmodem11301


# ******************************************
# ------------------------------------------
# HARDWARE / SWITCHES
# ------------------------------------------
# ******************************************

switches:
